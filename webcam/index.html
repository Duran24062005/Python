<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visor de Webcam</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #f0f0f0;
    padding: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 16px;
  }
  #video-container {
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #333;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* efecto espejo */
  }
  #placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  #controls {
    margin-top: 20px;
    display: flex;
    gap: 12px;
  }
  button {
    padding: 10px 20px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #f0f0f0;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) {
    background: #3a3a3a;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #status {
    margin-top: 12px;
    font-size: 13px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Visor de webcam</h1>

<div id="video-container">
  <video id="video" autoplay playsinline></video>
  <div id="placeholder">La cámara aún no está activa</div>
</div>

<div id="controls">
  <button id="startBtn">Iniciar cámara</button>
  <button id="stopBtn" disabled>Detener cámara</button>
</div>

<div id="status"></div>

<script>
  const video = document.getElementById('video');
  const placeholder = document.getElementById('placeholder');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');

  let stream = null;

  async function startCamera() {
    status.textContent = 'Solicitando permiso de cámara...';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      placeholder.style.display = 'none';
      startBtn.disabled = true;
      stopBtn.disabled = false;
      status.textContent = 'Cámara activa';
    } catch (err) {
      console.error(err);
      if (err.name === 'NotAllowedError') {
        status.textContent = 'Permiso denegado. Debes autorizar el acceso a la cámara en el navegador.';
      } else if (err.name === 'NotFoundError') {
        status.textContent = 'No se encontró ninguna cámara en este dispositivo.';
      } else {
        status.textContent = 'Error al acceder a la cámara: ' + err.message;
      }
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    video.srcObject = null;
    placeholder.style.display = 'flex';
    startBtn.disabled = false;
    stopBtn.disabled = true;
    status.textContent = 'Cámara detenida';
  }

  startBtn.addEventListener('click', startCamera);
  stopBtn.addEventListener('click', stopCamera);
</script>

</body>
</html>
